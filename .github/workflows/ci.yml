# Runs on pull requests so `main` has something to gate on.
#
# Register this job as a required status check in the branch protection rule,
# otherwise a rule that only demands review will happily merge code that does
# not compile.
name: Checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Checks are the place these changes get verified, so pushes to a pull request
# come in bursts. A superseded run has nothing left to say — cancel it rather
# than let the queue decide which answer arrives first.
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Covers the app and the ingestion tools, which share the corpus schema —
      # a change to one that breaks the other fails here rather than at ingest.
      - name: Typecheck
        run: npx tsc -b --pretty false

      - name: Build
        run: npm run build

      # The corpus is committed, so a malformed regeneration would otherwise
      # only surface in the browser.
      - name: Check the corpus is loadable
        run: |
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const manifest = JSON.parse(readFileSync("dist/data/manifest.json", "utf8"));
            if (!manifest.books.length) throw new Error("manifest lists no books");
            if (!manifest.search) throw new Error("no search index in the manifest");
            let hadiths = 0;
            for (const book of manifest.books) {
              // `dir` is relative to the data root, not the site root.
              const file = JSON.parse(readFileSync(`dist/data/${book.dir}/index.json`, "utf8"));
              if (file.hadiths.length !== book.hadithCount) {
                throw new Error(`${book.slug}: manifest says ${book.hadithCount} hadiths, file has ${file.hadiths.length}`);
              }
              hadiths += file.hadiths.length;
            }
            console.log(`${manifest.books.length} books, ${hadiths.toLocaleString()} hadiths, ${manifest.narratorCount.toLocaleString()} narrators`);
          '

      # Keep the build for the browser tests rather than making them build it
      # again — it is the same artefact either way, and it is what ships.
      - name: Keep the built site
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 1

  e2e:
    name: browser tests
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Take the built site from the build job
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      # Only Chromium: the suite drives WebGL and touch events, and the point
      # of it is whether the site works, not how three browsers differ.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run the browser tests
        run: npm test

      # A failure is nearly impossible to read from a log alone when the thing
      # under test is a 3D scene; the trace has the DOM and a screenshot.
      - name: Keep the traces of anything that failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
